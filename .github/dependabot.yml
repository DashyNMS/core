# Everything is pinned (actions by commit, packages by version), so nothing
# moves unless Dependabot proposes it. Minor and patch updates are grouped;
# majors come one at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: build(deps)
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    commit-message:
      prefix: build(deps)
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
      day: monday
    groups:
      packages:
        update-types: [minor, patch]
    # Microsoft.Extensions majors follow the .NET runtime, and Core takes
    # each target framework's own line (see DesktopNMS.Core.csproj). A new
    # major arrives with a new target framework, not from Dependabot.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
