name: Dependency submission

# Sends the full NuGet dependency tree to the dependency graph, so Dependabot
# alerts cover transitive packages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: Submit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # project.assets.json is what component detection reads.
      - name: Restore
        run: dotnet restore DashyNMS.Core.slnx
      - name: Submit to the dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@9887d3a4295305f4e7b03a1cfdb2099d44cadf52 # v0.2.1
        with:
          detectorsCategories: NuGet
