name: Release build

# Publishing a GitHub release (tag v<version>, on main's newest commit) builds
# it. The release goes back to being a draft while that happens, and is
# published again when everything in it is ready. If a build fails it stays a
# draft: see "Builds and releases" in docs/DEVELOPMENT.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (vX.Y.Z)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  hold:
    name: Hold the release
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'DashyNMS/core'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Make it a draft and build it from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" --draft
          gh workflow run release-build.yml --ref main -f tag="$TAG"

  version:
    name: Version
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'DashyNMS/core'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/build_version.py release --tag "$TAG"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    needs: [version, ci]
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.version.outputs.version }}
      commit: ${{ needs.version.outputs.commit }}

  publish:
    name: Publish
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
