name: Release

# A tag v1.2.3 tests, packs and publishes DesktopNMS.Core 1.2.3 to GitHub Packages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish the package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test DashyNMS.Core.sln -c Release

      - name: Pack
        run: dotnet pack src/DesktopNMS.Core/DesktopNMS.Core.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Publish to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://nuget.pkg.github.com/DashyNMS/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate